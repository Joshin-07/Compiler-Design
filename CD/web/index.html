<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arithmetic Expression Compiler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Arithmetic Expression Compiler</h1>
    <div class="input-group">
      <input type="text" id="expr-input" placeholder="Enter expression, e.g. 2+3*4" autofocus autocomplete="off">
      <button id="analyze-btn">Analyze</button>
    </div>
    <div id="result-box" class="result-box">
      <pre id="output">Expression : 2+3*4
Syntax     : VALID
Precedence : (2+(3*4))
Value      : 14</pre>
      <div id="tree-box"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
